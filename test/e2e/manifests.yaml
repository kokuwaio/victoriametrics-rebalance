# Two small VMClusters, alias Services that select blue, and a VMAgent that writes to both clusters (dual write:
# blue through the alias, green directly), for the end-to-end test.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  name: blue
  namespace: monitoring
spec:
  retentionPeriod: 7d
  replicationFactor: 1
  clusterVersion: v1.154.1-cluster
  vmstorage:
    replicaCount: 1
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 1Gi
    resources:
      requests: {cpu: 50m, memory: 64Mi}
  vmselect:
    replicaCount: 1
    resources:
      requests: {cpu: 50m, memory: 64Mi}
  vminsert:
    replicaCount: 1
    resources:
      requests: {cpu: 50m, memory: 64Mi}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  name: green
  namespace: monitoring
spec:
  retentionPeriod: 7d
  replicationFactor: 1
  clusterVersion: v1.154.1-cluster
  vmstorage:
    replicaCount: 2
    extraArgs:
      dedup.minScrapeInterval: 1ms
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 1Gi
    resources:
      requests: {cpu: 50m, memory: 64Mi}
  vmselect:
    replicaCount: 1
    extraArgs:
      dedup.minScrapeInterval: 1ms
    resources:
      requests: {cpu: 50m, memory: 64Mi}
  vminsert:
    replicaCount: 1
    resources:
      requests: {cpu: 50m, memory: 64Mi}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: agent
  namespace: monitoring
spec:
  selectAllByDefault: true
  scrapeInterval: 10s
  remoteWrite:
    - url: http://vminsert-active.monitoring.svc:8480/insert/0/prometheus/api/v1/write
    - url: http://vminsert-green.monitoring.svc:8480/insert/0/prometheus/api/v1/write
  resources:
    requests: {cpu: 50m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: vmselect-active
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: vmselect
    app.kubernetes.io/instance: blue
  ports:
    - name: http
      port: 8481
      targetPort: 8481
---
apiVersion: v1
kind: Service
metadata:
  name: vminsert-active
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: vminsert
    app.kubernetes.io/instance: blue
  ports:
    - name: http
      port: 8480
      targetPort: 8480
