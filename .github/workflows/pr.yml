name: pr

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel outdated runs of a pull request, so the Dependabot auto-merge job of an older run doesn't merge a newer
# commit whose checks haven't passed yet.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15

      - name: Build
        run: make build

  # A full migration on a kind cluster: operator, two VMClusters, dual write, sync, verify, final sync.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # run.sh creates its own cluster, so only install kind and kubectl.
      - name: Install kind and kubectl
        uses: helm/kind-action@v1.15.2
        with:
          install_only: true

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1

      - name: End-to-end test
        run: make e2e

  # Merges Dependabot pull requests once all checks passed. Needs "Allow auto-merge" in the repository settings.
  dependabot-auto-merge:
    needs:
      - check
      - e2e
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
