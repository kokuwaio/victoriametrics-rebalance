name: pr

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel outdated runs of a pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15

      - name: Build
        run: make build

  # A full migration on a kind cluster: operator, two VMClusters, dual write, sync, verify, final sync.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # run.sh creates its own cluster, so only install kind and kubectl.
      - name: Install kind and kubectl
        uses: helm/kind-action@v1.15.2
        with:
          install_only: true

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1

      - name: End-to-end test
        run: make e2e
