# One sync run (backfill or catch-up). Recreate the Job for every run: delete it, then apply it again.
#
# The state lives in the ConfigMap vmrebalance-<from>-<to>, so a pod that is evicted or restarted continues with
# the first unfinished chunk.
#
# Inside the cluster the tool connects to the Services and pods directly (--access=auto picks direct). If
# NetworkPolicies restrict the namespace, allow this pod to reach vmselect (8481), vminsert (8480) and
# vmstorage (8482).
#
# For the final sync after cutover, use job-final.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: vmrebalance-sync
  namespace: monitoring
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmrebalance
    spec:
      serviceAccountName: vmrebalance
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmrebalance
          # No image is published yet: build one from the Dockerfile and push it to your registry.
          image: vmrebalance:dev
          args:
            - sync
            - --from=vmcluster
            - --to=vmcluster-b
            - --concurrency=2
            # Copy at up to 50MiB/s, and slow down while blue's vmselect is busy. The rate is adjusted between chunks,
            # so use small chunks.
            - --rate-limit=50MiB/s
            - --adaptive
            - --step=1h
            - --metrics-addr=:8080
          ports:
            # The tool's own metrics (progress, rate limit, blue's load). Scrape them with a VMPodScrape.
            - name: http-metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
