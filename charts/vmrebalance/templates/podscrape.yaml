{{- if and .Values.metrics.enabled .Values.metrics.podScrape.enabled -}}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: {{ include "vmrebalance.fullname" . }}
  labels:
    {{- include "vmrebalance.labels" . | nindent 4 }}
    {{- with .Values.metrics.podScrape.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "vmrebalance.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: http-metrics
      interval: {{ .Values.metrics.podScrape.interval }}
{{- end }}
