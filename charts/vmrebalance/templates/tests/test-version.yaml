apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "vmrebalance.fullname" . }}-test-version"
  labels:
    {{- include "vmrebalance.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: vmrebalance
      image: {{ include "vmrebalance.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args: ["--version"]
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
